[project]
name = "meogeul-gyeolsim"
version = "4.0.0"
description = "먹을 결심 — 냉장고 재료와 실제 레시피로 만드는 다이어트·단백질 식단"
requires-python = ">=3.12,<3.13"
dependencies = [
  "requests==2.34.2", "python-dotenv==1.2.4", "beautifulsoup4==4.15.0",
  "langchain-core==1.6.12", "langchain-openai==1.7.2", "langgraph==1.2.16",
  "gradio==6.30.0", "ipykernel==7.4.0", "jupyterlab==4.6.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "nbformat==5.11.1", "nbclient==0.11.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = ["local_server: Gradio 화면 구성에 로컬 소켓이 필요한 테스트"]
